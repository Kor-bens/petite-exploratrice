<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#6C5CE7" />
  <title>Petite Exploratrice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>

    :root {
      --ink: #2d1b4e;
      --white: #fffdf8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: Nunito, system-ui, sans-serif; }
    .space-on main { overflow: hidden; padding: 8px 2px 4px; }
    body {
      background: radial-gradient(1200px 800px at 20% 0%, #ffeaa7 0%, transparent 50%),
                  radial-gradient(900px 700px at 100% 100%, #a29bfe 0%, transparent 45%),
                  linear-gradient(180deg, #74b9ff 0%, #a29bfe 45%, #fd79a8 100%);
      color: var(--ink);
    }
    #app { height: 100%; display: flex; flex-direction: column; padding: 12px; max-width: 920px; margin: 0 auto; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,.72); backdrop-filter: blur(10px);
      border-radius: 22px; padding: 10px 14px; box-shadow: 0 8px 24px rgba(45,27,78,.12);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.15rem; }
    .mascot { font-size: 1.8rem; animation: float 2.4s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-5px); } }
    .stars { background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 800; box-shadow: inset 0 0 0 3px #ffeaa7; }
    button {
      font-family: inherit; font-weight: 800; border: 0; cursor: pointer;
      border-radius: 18px; transition: transform .15s ease, box-shadow .15s;
    }
    button:active { transform: scale(.96); }
    .icon-btn { width: 46px; height: 46px; font-size: 1.3rem; background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    main { flex: 1; overflow: auto; padding: 14px 2px 8px; }
    .hero {
      text-align: center; color: #fff; text-shadow: 0 3px 10px rgba(0,0,0,.18);
      margin: 8px 0 18px;
    }
    .hero h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.4rem); }
    .hero p { margin: 6px 0 0; font-size: 1.05rem; opacity: .95; }
    .worlds { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .world {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 150px; padding: 16px; color: #fff; font-size: 1.2rem;
      box-shadow: 0 10px 0 rgba(0,0,0,.12), 0 16px 28px rgba(0,0,0,.12);
    }
    .world span { font-size: 3rem; margin-bottom: 6px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.12)); }
    .w1 { background: linear-gradient(160deg, #0984e3, #6c5ce7); }
    .w2 { background: linear-gradient(160deg, #00b894, #55efc4); color: #064e3b; }
    .w3 { background: linear-gradient(160deg, #fdcb6e, #e17055); }
    .w4 { background: linear-gradient(160deg, #e17055, #d63031); }
    .w5 { background: linear-gradient(160deg, #00cec9, #0984e3); }
    .screen { display: none; }
    .screen.on { display: block; animation: pop .28s ease; }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }
    .backrow { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .space-on .backrow, .geo-on .backrow { margin-bottom: 8px; }
    .chip { background: #fff; padding: 10px 14px; font-size: 1rem; box-shadow: 0 5px 0 #dfe6e9; }
    .chip.active { background: #ffeaa7; box-shadow: 0 5px 0 #fdcb6e; }
    .card {
      background: rgba(255,253,248,.92); border-radius: 24px; padding: 18px;
      box-shadow: 0 12px 30px rgba(45,27,78,.12);
    }
    .space-on .card { padding: 10px; }
    .geo-on .card { padding: 12px; }
    .big { font-size: clamp(3.2rem, 12vw, 5.5rem); text-align: center; line-height: 1; margin: 8px 0; }
    .say { text-align: center; font-size: 1.25rem; margin: 0 0 16px; }
    .choices { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 560px) { .choices { grid-template-columns: 1fr 1fr; } }
    .choice {
      background: #fff; padding: 14px; font-size: 1.15rem; text-align: left;
      box-shadow: 0 6px 0 #dfe6e9; display: flex; align-items: center; gap: 10px;
    }
    .choice .e { font-size: 1.8rem; }
    .choice.good { background: #55efc4; box-shadow: 0 6px 0 #00b894; }
    .choice.bad { background: #fab1a0; box-shadow: 0 6px 0 #e17055; }
    .explore-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
    .tile {
      background: #fff; min-height: 120px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px; font-size: 1.05rem;
      box-shadow: 0 7px 0 #dfe6e9;
    }
    .tile .e { font-size: 2.4rem; }
    .fact {
      margin-top: 14px; background: #fff7d6; border-radius: 18px; padding: 14px;
      font-size: 1.15rem; min-height: 72px;
    }
    .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .progress { height: 12px; flex: 1; margin: 0 12px; background: #eee; border-radius: 99px; overflow: hidden; }
    .progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#fdcb6e,#e17055); transition: width .3s; }
    .overlay {
      position: fixed; inset: 0; background: rgba(45,27,78,.45); display: none;
      align-items: center; justify-content: center; padding: 20px; z-index: 20;
    }
    .overlay.on { display: flex; }
    .modal { background: #fff; border-radius: 28px; padding: 24px; text-align: center; max-width: 360px; width: 100%; }
    .modal h2 { margin: 0 0 8px; }
    .cta { background: linear-gradient(180deg, #ffeaa7, #fdcb6e); padding: 14px 22px; font-size: 1.1rem; box-shadow: 0 6px 0 #e17055; color: #5d3a00; margin-top: 8px; }
    .speak-btn { background: #a29bfe; color: #fff; padding: 12px 16px; box-shadow: 0 6px 0 #6c5ce7; }
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
    .parent-note { font-size: .85rem; opacity: .8; text-align: center; margin-top: 16px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.2); }
    #modeSolar { display: none; }
    .space-on #modeSolar { display: inline-flex; }
    .solar-card { background: #0b0724 !important; color: #fff; }
    .solar-wrap { position: relative; }
    .solar {
      position: relative;
      width: min(100%, 540px);
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,210,80,.18), transparent 18%),
        radial-gradient(circle at 20% 15%, #2a1f6e, transparent 35%),
        radial-gradient(circle at 80% 80%, #1b3a7a, transparent 40%),
        #07051a;
      box-shadow: inset 0 0 80px rgba(0,0,0,.45);
    }
    .solar .twinkle {
      position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%;
      animation: tw 2.4s ease-in-out infinite;
    }
    @keyframes tw { 50% { opacity: .2; transform: scale(.6); } }
    .sun {
      position: absolute; left: 50%; top: 50%;
      width: 58px; height: 58px; margin: -29px 0 0 -29px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff6b0, #ffd166 40%, #ff8c00 78%, #ff4d00);
      box-shadow: 0 0 28px #ffb703, 0 0 60px rgba(255,170,0,.55);
      z-index: 9; cursor: pointer; border: 0;
    }
    .sun::after {
      content: ""; position: absolute; inset: -10px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,200,60,.35), transparent 70%);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform: scale(1.12); opacity: .7; } }
    .orbit {
      position: absolute; left: 50%; top: 50%;
      border: 1px dashed rgba(255,255,255,.22);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: spin linear infinite;
    }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    .planet {
      position: absolute; top: 0; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      cursor: pointer; border: 0; padding: 0;
      box-shadow: 0 0 10px rgba(255,255,255,.25);
    }
    .planet:active { transform: translate(-50%, -50%) scale(1.15); }
    .p-mercure { width: 11px; height: 11px; background: #c9b199; }
    .p-venus { width: 16px; height: 16px; background: linear-gradient(#f3e2b0, #d4a017); }
    .p-terre { width: 18px; height: 18px; background: radial-gradient(circle at 30% 30%, #7fdbff, #2ecc71 45%, #0984e3); }
    .p-mars { width: 14px; height: 14px; background: radial-gradient(circle at 30% 30%, #ff9f7a, #c0392b); }
    .p-jupiter { width: 30px; height: 30px; background: repeating-linear-gradient(180deg, #e8c38b 0 4px, #c9934a 4px 7px, #f0d6a6 7px 10px); }
    .p-saturne { width: 26px; height: 26px; background: linear-gradient(#f6e2b3, #d4a84b); }
    .p-saturne::after {
      content: ""; position: absolute; left: -9px; right: -9px; top: 46%;
      height: 5px; border-radius: 50%;
      border: 2px solid rgba(232,214,170,.9);
      transform: rotate(-18deg);
    }
    .p-uranus { width: 20px; height: 20px; background: radial-gradient(circle at 30% 30%, #d6f6ff, #7ed6df); }
    .p-neptune { width: 19px; height: 19px; background: radial-gradient(circle at 30% 30%, #9ad0ff, #1e3799); }
    .moon-orbit {
      position: absolute; left: 50%; top: 50%;
      width: 34px; height: 34px; margin: -17px 0 0 -17px;
      border-radius: 50%;
      animation: spin 3.2s linear infinite;
    }
    .moon {
      position: absolute; top: 0; left: 50%;
      width: 7px; height: 7px; margin-left: -3.5px;
      border-radius: 50%; background: #f1f2f6;
      box-shadow: 0 0 6px #fff;
    }
    .o1 { width: 22%; height: 22%; animation-duration: 7s; }
    .o2 { width: 32%; height: 32%; animation-duration: 11s; }
    .o3 { width: 42%; height: 42%; animation-duration: 16s; }
    .o4 { width: 52%; height: 52%; animation-duration: 22s; }
    .o5 { width: 64%; height: 64%; animation-duration: 34s; }
    .o6 { width: 75%; height: 75%; animation-duration: 44s; }
    .o7 { width: 86%; height: 86%; animation-duration: 56s; }
    .o8 { width: 96%; height: 96%; animation-duration: 68s; }
    .solar-fact {
      margin-top: 8px; background: rgba(255,255,255,.12);
      border-radius: 14px; padding: 10px 12px; color: #fff; min-height: 52px; font-size: 1.02rem;
    }
    .solar-hint { text-align: center; color: #dfe6ff; margin: 0 0 6px; font-size: .95rem; }
    .solar3d {
      position: relative;
      width: 100%;
      height: min(72dvh, calc(100dvh - 210px), 640px);
      min-height: 280px;
      border-radius: 18px;
      overflow: hidden;
      background: #050218;
      touch-action: none;
    }
    .solar3d canvas { display: block; width: 100%; height: 100%; }
    .cam-btns {
      position: absolute; right: 8px; top: 8px;
      display: flex; flex-direction: column; gap: 8px; z-index: 3;
    }
    .cam-btns button {
      width: 46px; height: 46px; border-radius: 14px;
      background: rgba(255,255,255,.94); font-size: 1.25rem;
      box-shadow: 0 4px 10px rgba(0,0,0,.25);
    }
    .planet-bar {
      display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 2px;
      -webkit-overflow-scrolling: touch;
    }
    .planet-bar button {
      flex: 0 0 auto; min-width: 64px; padding: 8px 8px 6px;
      background: rgba(255,255,255,.12); color: #fff; font-size: .78rem;
      border-radius: 14px; line-height: 1.15;
    }
    .planet-bar button span { display: block; font-size: 1.35rem; }
    .planet-bar button:active { background: #ffeaa7; color: #2d1b4e; }
    #modeMap { display: none; }
    .geo-on #modeMap { display: inline-flex; }
    .world-map {
      width: 100%; height: auto; display: block;
      max-height: min(68dvh, 560px);
      background: #1e90ff;
      border-radius: 18px;
    }
    .world-map .land {
      cursor: pointer; stroke: #fff; stroke-width: 2.2;
      filter: drop-shadow(0 3px 0 rgba(0,40,80,.18));
    }
    .world-map .land.on { stroke: #2d1b4e; stroke-width: 4; filter: brightness(1.06); }
    .map-label {
      font-size: 13px; font-weight: 900; font-family: Nunito, sans-serif;
      fill: #fff; pointer-events: none;
      paint-order: stroke; stroke: rgba(0,0,0,.28); stroke-width: 3px;
    }
    .map-animal { font-size: 16px; pointer-events: none; }
    .pin { cursor: pointer; }
    .pin circle { fill: #fff; stroke: #2d1b4e; stroke-width: 1.6; }
    .pin.home circle { fill: #ffeaa7; stroke: #e17055; stroke-width: 2.4; }
    .pin text { font-size: 13px; font-weight: 800; font-family: Nunito, sans-serif; pointer-events: none; }
    .map-title {
      text-align: center; margin: 0 0 8px; font-size: 1.25rem; color: #0984e3;
    }
    .map-fact {
      margin-top: 10px; background: #fff7d6; border-radius: 16px;
      padding: 12px 14px; font-size: 1.08rem; min-height: 58px;
    }
  
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand"><span class="mascot">🌟</span> Petite Exploratrice</div>
      <div class="stars">⭐ <span id="starCount">0</span></div>
    </header>
    <main>
      <section id="home" class="screen on">
        <div class="hero">
          <h1>On part à l’aventure ?</h1>
          <p>Tape un monde. J’écoute et j’apprends !</p>
        </div>
        <div class="worlds">
          <button class="world w1" onclick="openWorld('espace')"><span>🚀</span>Espace</button>
          <button class="world w2" onclick="openWorld('science')"><span>🔬</span>Sciences</button>
          <button class="world w3" onclick="openWorld('metiers')"><span>👩‍🚒</span>Métiers</button>
          <button class="world w4" onclick="openWorld('histoire')"><span>🏰</span>Histoire</button>
          <button class="world w5" onclick="openWorld('geo')"><span>🌍</span>Géographie</button>
        </div>
        <p class="parent-note">Pour les 4 ans • voix française • sans pub • tablette ou téléphone</p>
      </section>
      <section id="world" class="screen">
        <div class="backrow">
          <button class="icon-btn" onclick="goHome()">🏠</button>
          <button class="chip" id="modeExplore" onclick="setMode('explore')">👀 Découvrir</button>
          <button class="chip" id="modeSolar" onclick="setMode('solar')">🪐 Système solaire</button>
          <button class="chip" id="modeMap" onclick="setMode('map')">🗺️ Carte du monde</button>
          <button class="chip" id="modeQuiz" onclick="setMode('quiz')">🎯 Quiz</button>
          <button class="speak-btn" onclick="speakWelcome()">🔊 Écoute</button>
        </div>
        <div class="card" id="worldCard">
          <div class="bar">
            <strong id="worldTitle">Monde</strong>
            <div class="progress"><i id="prog"></i></div>
            <span id="qnum"></span>
          </div>
          <div id="content"></div>
        </div>
      </section>
    </main>
  </div>
  <div class="overlay" id="win">
    <div class="modal">
      <div class="big">🎉</div>
      <h2>Bravo, exploratrice !</h2>
      <p id="winText">Tu as gagné des étoiles.</p>
      <button class="cta" onclick="closeWin()">Encore une aventure</button>
    </div>
  </div>
  <canvas id="confetti"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
const DATA = {
  espace: {
    title: "L’espace",
    welcome: "Bienvenue dans l’espace ! On va voir le Soleil, la Lune et les planètes.",
    items: [
      { e:"☀️", n:"Soleil", t:"Le Soleil est une grande étoile. Il nous donne de la lumière et de la chaleur." },
      { e:"🌙", n:"Lune", t:"La Lune tourne autour de la Terre. La nuit, elle brille dans le ciel." },
      { e:"🌍", n:"Terre", t:"La Terre est notre planète. C’est là que nous habitons." },
      { e:"🔴", n:"Mars", t:"Mars est une planète rouge. On l’appelle la planète rouge." },
      { e:"🪐", n:"Saturne", t:"Saturne a de beaux anneaux autour d’elle." },
      { e:"🚀", n:"Fusée", t:"Une fusée s’envole très haut pour aller dans l’espace." },
      { e:"👨‍🚀", n:"Astronaute", t:"Un astronaute voyage dans l’espace avec une combinaison spéciale." },
      { e:"⭐", n:"Étoile", t:"Les étoiles sont des soleils très, très loin. Elles scintillent." }
    ],
    quiz: [
      { q:"Qu’est-ce qui nous donne de la lumière le jour ?", e:"☀️", ok:"Le Soleil", opts:["Le Soleil","Un frigo","Un bateau"], oe:["☀️","🧊","⛵"] },
      { q:"Qui voyage dans l’espace ?", e:"👨‍🚀", ok:"L’astronaute", opts:["L’astronaute","Le poisson","Le nuage"], oe:["👨‍🚀","🐟","☁️"] },
      { q:"Quelle planète a des anneaux ?", e:"🪐", ok:"Saturne", opts:["Saturne","Une pomme","Un train"], oe:["🪐","🍎","🚂"] },
      { q:"Où habitons-nous ?", e:"🌍", ok:"La Terre", opts:["La Terre","La Lune","Une étoile"], oe:["🌍","🌙","⭐"] },
      { q:"Avec quoi on va dans l’espace ?", e:"🚀", ok:"Une fusée", opts:["Une fusée","Un vélo","Une cuillère"], oe:["🚀","🚲","🥄"] }
    ]
  },
  science: {
    title: "Les sciences",
    welcome: "On découvre les animaux, les plantes, l’eau et le temps qu’il fait.",
    items: [
      { e:"🌧️", n:"Pluie", t:"La pluie, c’est de l’eau qui tombe des nuages." },
      { e:"🌈", n:"Arc-en-ciel", t:"L’arc-en-ciel apparaît quand le soleil brille pendant la pluie." },
      { e:"🌱", n:"Plante", t:"Une plante a besoin d’eau, de terre et de soleil pour grandir." },
      { e:"🦋", n:"Papillon", t:"Le papillon était d’abord une chenille. Puis il a des ailes." },
      { e:"🧊", n:"Glace", t:"Quand l’eau a très froid, elle devient de la glace." },
      { e:"💨", n:"Vent", t:"Le vent, c’est de l’air qui bouge. Il fait danser les feuilles." },
      { e:"🧲", n:"Aimant", t:"Un aimant attire le métal. Comme par magie !" },
      { e:"🫧", n:"Bulles", t:"Les bulles sont remplies d’air. Elles sont rondes et légères." }
    ],
    quiz: [
      { q:"De quoi a besoin une plante pour grandir ?", e:"🌱", ok:"D’eau et de soleil", opts:["D’eau et de soleil","De bonbons","D’une télé"], oe:["☀️","🍬","📺"] },
      { q:"Quand l’eau est très froide, elle devient…", e:"🧊", ok:"De la glace", opts:["De la glace","Du feu","Du sable"], oe:["🧊","🔥","🏖️"] },
      { q:"Qu’est-ce qui tombe des nuages ?", e:"🌧️", ok:"La pluie", opts:["La pluie","Des chaussettes","Des vélos"], oe:["🌧️","🧦","🚲"] },
      { q:"Le papillon était d’abord…", e:"🦋", ok:"Une chenille", opts:["Une chenille","Un lion","Un avion"], oe:["🐛","🦁","✈️"] },
      { q:"Le vent, c’est…", e:"💨", ok:"De l’air qui bouge", opts:["De l’air qui bouge","Du chocolat","Une chaise"], oe:["💨","🍫","🪑"] }
    ]
  },
  metiers: {
    title: "Les métiers",
    welcome: "Les métiers, ce sont les travaux des grandes personnes. Chacun aide les autres.",
    items: [
      { e:"👩‍⚕️", n:"Docteur", t:"Le docteur soigne les gens quand ils sont malades." },
      { e:"👩‍🚒", n:"Pompier", t:"Le pompier éteint le feu et aide les personnes en danger." },
      { e:"👩‍🏫", n:"Maîtresse", t:"La maîtresse apprend à lire, à compter et à jouer à l’école." },
      { e:"👨‍🍳", n:"Cuisinier", t:"Le cuisinier prépare de bons plats à manger." },
      { e:"👷", n:"Maçon", t:"Le maçon construit les maisons avec des briques." },
      { e:"👩‍🌾", n:"Agricultrice", t:"L’agricultrice fait pousser les fruits, les légumes et le blé." },
      { e:"👩‍✈️", n:"Pilote", t:"Le pilote conduit l’avion dans le ciel." },
      { e:"👮", n:"Policier", t:"Le policier aide à ce que tout le monde soit en sécurité." }
    ],
    quiz: [
      { q:"Qui soigne les malades ?", e:"👩‍⚕️", ok:"Le docteur", opts:["Le docteur","Le nuage","Le crayon"], oe:["👩‍⚕️","☁️","✏️"] },

function speak(text) {
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR";
    u.rate = 0.92;
    const voices = speechSynthesis.getVoices();
    const fr = voices.find(v => v.lang.startsWith("fr") && /female|femme|Google français|Amel|Thomas|Audrey/i.test(v.name))
            || voices.find(v => v.lang.startsWith("fr"));
    if (fr) u.voice = fr;
    speechSynthesis.speak(u);
  } catch(e) {}
}

let solar = null;

function stopSolar3D() {
  if (!solar) return;
  cancelAnimationFrame(solar.raf);
  window.removeEventListener("resize", solar.onResize);
  if (solar.renderer) {
    solar.renderer.dispose();
    if (solar.renderer.domElement && solar.renderer.domElement.parentNode) {
      solar.renderer.domElement.parentNode.removeChild(solar.renderer.domElement);
    }
  }
  solar = null;
}

function startSolar3D() {
  stopSolar3D();
  if (typeof THREE === "undefined") {
    const el = document.getElementById("fact");
    if (el) el.textContent = "Le ciel 3D a besoin d’internet la première fois (Three.js).";
    return;
  }
  const holder = document.getElementById("solar3d");
  if (!holder) return;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050218);
  scene.fog = new THREE.FogExp2(0x050218, 0.012);

  const w = holder.clientWidth || 360;
  const h = holder.clientHeight || 400;
  const camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 400);
  camera.position.set(0, 10, 26);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
  holder.insertBefore(renderer.domElement, holder.firstChild);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = true;
  controls.panSpeed = 0.7;
  controls.rotateSpeed = 0.7;
  controls.zoomSpeed = 1.1;
  controls.minDistance = 6;
  controls.maxDistance = 120;
  controls.target.set(0, 0, 0);
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;
  controls.touches = {
    ONE: THREE.TOUCH.ROTATE,
    TWO: THREE.TOUCH.DOLLY_PAN
  };
  controls.addEventListener("start", () => { controls.autoRotate = false; });

  scene.add(new THREE.AmbientLight(0x8899cc, 0.35));
  const sunLight = new THREE.PointLight(0xfff1c1, 3.4, 200, 2);
  scene.add(sunLight);
  const fill = new THREE.DirectionalLight(0x334466, 0.25);
  fill.position.set(-30, 10, 20);
  scene.add(fill);

  function texPlanet(draw) {
    const c = document.createElement("canvas");
    c.width = 512; c.height = 256;
    const g = c.getContext("2d");
    draw(g, c);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = THREE.RepeatWrapping;
    return t;
  }
  function noise(g, n, color, size) {
    g.fillStyle = color;
    for (let i = 0; i < n; i++) {
      g.globalAlpha = 0.15 + Math.random() * 0.45;
      g.beginPath();
      g.arc(Math.random()*512, Math.random()*256, size * Math.random(), 0, 7);
      g.fill();
    }
    g.globalAlpha = 1;
  }
  const TEX = {
    soleil: texPlanet((g,c) => {
      const grd = g.createLinearGradient(0,0,0,256);
      grd.addColorStop(0,"#fff6c2"); grd.addColorStop(.4,"#ffcc33"); grd.addColorStop(1,"#ff7a00");
      g.fillStyle = grd; g.fillRect(0,0,512,256);
      noise(g, 80, "#ffef9a", 18); noise(g, 40, "#ff4d00", 12);
    }),
    mercure: texPlanet((g) => {
      g.fillStyle = "#8a7a6a"; g.fillRect(0,0,512,256);
      noise(g, 220, "#6b5d52", 7); noise(g, 80, "#cfc3b6", 4);
    }),
    venus: texPlanet((g) => {
      const grd = g.createLinearGradient(0,0,0,256);
      grd.addColorStop(0,"#f6e2b3"); grd.addColorStop(.5,"#e0b35a"); grd.addColorStop(1,"#c98a3a");
      g.fillStyle = grd; g.fillRect(0,0,512,256);
      g.globalAlpha = .35;
      for (let y=0;y<256;y+=8){ g.fillStyle = y%16? "#fff2cc":"#d49a3a"; g.fillRect(0,y,512,5); }
      g.globalAlpha = 1;
    }),
    terre: texPlanet((g) => {
      g.fillStyle = "#1b4f9c"; g.fillRect(0,0,512,256);
      g.fillStyle = "#2e9e4f";
      [[80,70,50,30],[200,90,70,40],[330,60,40,22],[420,140,55,28],[140,180,60,25],[280,160,80,30]].forEach(([x,y,w,h])=>{
        g.beginPath(); g.ellipse(x,y,w,h,0.2,0,7); g.fill();
      });
      g.fillStyle = "#eef6ff";
      g.beginPath(); g.ellipse(256,18,220,22,0,0,7); g.fill();
      g.beginPath(); g.ellipse(256,240,220,18,0,0,7); g.fill();
      noise(g, 40, "#87ceeb", 8);
    }),
    lune: texPlanet((g) => {
      g.fillStyle = "#cfcfd6"; g.fillRect(0,0,512,256);
      noise(g, 180, "#8e8e98", 6); noise(g, 40, "#ececf2", 10);
    }),
    mars: texPlanet((g) => {
      g.fillStyle = "#b34428"; g.fillRect(0,0,512,256);
      noise(g, 120, "#7a2a16", 8); noise(g, 50, "#e08a55", 6);
      g.fillStyle = "#f2f2f2"; g.beginPath(); g.ellipse(256,16,180,16,0,0,7); g.fill();
    }),
    jupiter: texPlanet((g) => {
      const cols = ["#e8d0a0","#c9934a","#f0d6a6","#a56b32","#ead8b0","#d4a056"];
      for (let y=0;y<256;y++){ g.fillStyle = cols[Math.floor(y/18)%cols.length]; g.fillRect(0,y,512,18); }
      g.fillStyle = "#c45c3e"; g.beginPath(); g.ellipse(340,150,38,22,0.2,0,7); g.fill();
    }),
    saturne: texPlanet((g) => {
      const cols = ["#f3e2b8","#e0c07a","#d4a84b","#f6e7c4"];
      for (let y=0;y<256;y++){ g.fillStyle = cols[Math.floor(y/20)%cols.length]; g.fillRect(0,y,512,20); }
    }),
    uranus: texPlanet((g) => {
      const grd = g.createLinearGradient(0,0,0,256);
      grd.addColorStop(0,"#d6f6ff"); grd.addColorStop(.5,"#7ed6df"); grd.addColorStop(1,"#4aa8b5");
      g.fillStyle = grd; g.fillRect(0,0,512,256);
    }),
    neptune: texPlanet((g) => {
      const grd = g.createLinearGradient(0,0,0,256);
      grd.addColorStop(0,"#7eb6ff"); grd.addColorStop(.5,"#1e3799"); grd.addColorStop(1,"#0b1d5c");
      g.fillStyle = grd; g.fillRect(0,0,512,256);
      g.fillStyle = "#9ad0ff"; g.beginPath(); g.ellipse(200,130,28,16,0,0,7); g.fill();
    })
  };
  function ringTex() {
    const c = document.createElement("canvas"); c.width=512; c.height=64;
    const g = c.getContext("2d");
    for (let x=0;x<512;x++){
      const a = (x>40 && x<470) ? (0.15 + 0.7*Math.abs(Math.sin(x*0.2))) : 0;
      const col = x%37<4 ? 80 : 210;
      g.fillStyle = `rgba(${col},${col-20},150,${a})`;
      g.fillRect(x,0,1,64);
    }
    const t = new THREE.CanvasTexture(c);
    return t;
  }

  const starGeo = new THREE.BufferGeometry();
  const starPos = [];
  for (let i = 0; i < 900; i++) {
    starPos.push((Math.random() - 0.5) * 260, (Math.random() - 0.5) * 160, (Math.random() - 0.5) * 260);
  }
  starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35 })));

  const pickables = [];
  const movers = [];

  function addOrbitRing(radius) {
    const pts = [];
    for (let i = 0; i <= 96; i++) {
      const a = (i / 96) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
    }
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.LineLoop(g, new THREE.LineBasicMaterial({ color: 0x8aa4ff, transparent: true, opacity: 0.28 }));
    scene.add(line);
  }

  function makePlanet(key, radius, distance, speed, extra) {
    const pivot = new THREE.Object3D();
    pivot.rotation.y = Math.random() * Math.PI * 2;
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(radius, 48, 48),
      new THREE.MeshStandardMaterial({
        map: TEX[key],
        roughness: key === "venus" ? 0.85 : 0.5,
        metalness: 0.04,
        emissive: key === "soleil" ? 0xffaa00 : 0x000000
      })
    );
    mesh.position.x = distance;
    mesh.userData.key = key;
    pivot.add(mesh);
    scene.add(pivot);
    addOrbitRing(distance);
    pickables.push(mesh);
    movers.push({ pivot, speed, mesh });
    if (extra) extra(mesh, pivot, distance);
    return mesh;
  }

  const sun = new THREE.Mesh(
    new THREE.SphereGeometry(2.6, 48, 48),
    new THREE.MeshBasicMaterial({ map: TEX.soleil })
  );
  sun.userData.key = "soleil";
  scene.add(sun);
  pickables.push(sun);
  [3.4, 4.4, 5.4].forEach((r, i) => {
    scene.add(new THREE.Mesh(
      new THREE.SphereGeometry(r, 24, 24),
      new THREE.MeshBasicMaterial({ color: i ? 0xff9900 : 0xffee88, transparent: true, opacity: 0.08 - i*0.02 })
    ));
  });

  makePlanet("mercure", 0.42, 5.4, 0.024);
  makePlanet("venus", 0.68, 7.4, 0.015);
  makePlanet("terre", 0.74, 9.6, 0.011, (earth) => {
    const atmo = new THREE.Mesh(
      new THREE.SphereGeometry(0.82, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0x7ec8ff, transparent: true, opacity: 0.18, side: THREE.BackSide })
    );
    earth.add(atmo);
    const moonPivot = new THREE.Object3D();
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(0.24, 24, 24),
      new THREE.MeshStandardMaterial({ map: TEX.lune, roughness: 0.9 })
    );
    moon.position.x = 1.45;
    moon.userData.key = "lune";
    moonPivot.add(moon);
    earth.add(moonPivot);
    pickables.push(moon);
    movers.push({ pivot: moonPivot, speed: 0.045, mesh: moon });
  });
  makePlanet("mars", 0.52, 11.8, 0.009);
  makePlanet("jupiter", 1.7, 15.6, 0.005);
  makePlanet("saturne", 1.38, 19.8, 0.0035, (sat) => {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(1.8, 2.85, 80),
      new THREE.MeshBasicMaterial({
        map: ringTex(),
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.9
      })
    );
    ring.rotation.x = Math.PI / 2.12;
    ring.userData.key = "saturne";
    sat.add(ring);
    pickables.push(ring);
  });
  makePlanet("uranus", 0.95, 23.6, 0.0024);
  makePlanet("neptune", 0.92, 27.0, 0.0018);

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let tapX = 0, tapY = 0;

  function pick(ev) {
    const rect = renderer.domElement.getBoundingClientRect();
    const cx = (ev.changedTouches ? ev.changedTouches[0].clientX : ev.clientX);
    const cy = (ev.changedTouches ? ev.changedTouches[0].clientY : ev.clientY);
    if (Math.hypot(cx - tapX, cy - tapY) > 14) return;
    pointer.x = ((cx - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((cy - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(pickables, false);
    if (hits.length) tapPlanet(hits[0].object.userData.key);
  }
  renderer.domElement.addEventListener("pointerdown", e => { tapX = e.clientX; tapY = e.clientY; });
  renderer.domElement.addEventListener("pointerup", pick);

  function onResize() {
    if (!holder || !solar) return;
    const ww = holder.clientWidth, hh = holder.clientHeight;
    camera.aspect = ww / Math.max(hh, 1);
    camera.updateProjectionMatrix();
    renderer.setSize(ww, hh);
  }

  function tick() {
    if (!solar) return;
    movers.forEach(m => { m.pivot.rotation.y += m.speed; if (m.mesh) m.mesh.rotation.y += 0.01; });
    sun.rotation.y += 0.003;
    controls.update();
    renderer.render(scene, camera);
    solar.raf = requestAnimationFrame(tick);
  }

  solar = { renderer, camera, controls, onResize, raf: 0 };
  window.addEventListener("resize", onResize);
  requestAnimationFrame(onResize);
  solar.raf = requestAnimationFrame(tick);
}

function solarZoom(factor) {
  if (!solar) return;
  solar.camera.position.multiplyScalar(factor);
  const d = solar.camera.position.length();
  if (d < 6) solar.camera.position.setLength(6);
  if (d > 120) solar.camera.position.setLength(120);
}
function solarReset() {
  if (!solar) return;
  solar.camera.position.set(0, 10, 26);
  solar.controls.target.set(0, 0, 0);
  solar.controls.autoRotate = true;
}

function tapPlanet(key) {
  const p = PLANETS[key];
  if (!p) return;
  const el = document.getElementById("fact");
  if (el) el.innerHTML = `<strong>${p.n}</strong><br>${p.t}`;
  speak(`${p.n}. ${p.t}`);
  addStar(1);
}
function showQuiz() {
  const w = DATA[worldKey];
  const q = w.quiz[qi];
  document.getElementById("prog").style.width = ((qi) / w.quiz.length * 100) + "%";
  document.getElementById("qnum").textContent = (qi+1) + "/" + w.quiz.length;
  const opts = q.opts.map((o,i)=>({o, e:q.oe[i]})).sort(()=>Math.random()-.5);
  document.getElementById("content").innerHTML = `
    <div class="big">${q.e}</div>
    <p class="say">${q.q}</p>
    <div class="choices">
      ${opts.map(x=>`<button class="choice" data-ok="${x.o===q.ok}" onclick="answer(this,'${q.ok.replace(/'/g,"\\'")}')"><span class="e">${x.e}</span>${x.o}</button>`).join("")}
    </div>`;
  speak(q.q);
}
function answer(btn, ok) {
  if (locked) return;
  locked = true;
  const good = btn.dataset.ok === "true";
  document.querySelectorAll(".choice").forEach(b => {
    if (b.dataset.ok === "true") b.classList.add("good");
  });
  if (!good) btn.classList.add("bad");
  if (good) {
    speak("Bravo ! C’est juste.");
    addStar(2);
    burst();
  } else {
    speak("Presque. La bonne réponse est : " + ok);
  }
  setTimeout(() => {
    qi++;
    if (qi >= DATA[worldKey].quiz.length) {
      document.getElementById("prog").style.width = "100%";
      document.getElementById("winText").textContent = "Tu as fini le quiz " + DATA[worldKey].title + " !";
      document.getElementById("win").classList.add("on");
      speak("Bravo exploratrice ! Tu as fini le quiz.");
      burst();
    } else {
      showQuiz();
    }
  }, 1600);
}
function addStar(n) {
  stars += n;
  localStorage.setItem("pe_stars", stars);
  document.getElementById("starCount").textContent = stars;
}
function closeWin() {
  document.getElementById("win").classList.remove("on");
  setMode("explore");
}

/* confetti */
const cv = document.getElementById("confetti");
const ctx = cv.getContext("2d");
let bits = [];
function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", resize); resize();
function burst(){
  for(let i=0;i<80;i++){
    bits.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-0.5)*8,vy:Math.random()*-8-2,s:6+Math.random()*7,c:`hsl(${Math.random()*360},90%,60%)`,life:90});
  }
}
(function loop(){
  ctx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b=>{
    b.x+=b.vx; b.y+=b.vy; b.vy+=0.18; b.life--;
    ctx.fillStyle=b.c; ctx.fillRect(b.x,b.y,b.s,b.s);
  });
  bits = bits.filter(b=>b.life>0);
  requestAnimationFrame(loop);
})();

  </script>
